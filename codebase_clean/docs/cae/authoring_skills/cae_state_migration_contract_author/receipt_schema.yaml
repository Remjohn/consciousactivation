type: object
required:
  - receipt_id
  - skill_id
  - skill_version
  - authored_contract_id
  - aggregate_name
  - execution_timestamp_utc
  - validator_result
  - zero_data_movement_verified
  - stages_modeled_count
properties:
  receipt_id:
    type: string
    pattern: "^RCP-MIG-[0-9a-f]{8}$"
  skill_id:
    type: string
    const: "cae_state_migration_contract_author"
  skill_version:
    type: string
  authored_contract_id:
    type: string
  aggregate_name:
    type: string
  execution_timestamp_utc:
    type: string
  validator_result:
    type: string
    enum:
      - "PASS_CONTRACT_VALIDATED"
      - "FAIL_EXECUTION_ATTEMPT_DETECTED"
      - "FAIL_MULTI_AGGREGATE"
  zero_data_movement_verified:
    type: boolean
  stages_modeled_count:
    type: integer
    minimum: 1
    maximum: 5
