base_repository:
  preferred_url: https://github.com/Remjohn/BMAD-METHOD
  fallback_url: https://github.com/bmad-code-org/BMAD-METHOD
  preserve_original: true

mandatory_directories:
  - src/core-skills
  - src/bmm-skills
  - src/scripts
  - tools
  - docs

mandatory_skills:
  - src/core-skills/bmad-help/SKILL.md
  - src/core-skills/bmad-deep-recon/SKILL.md
  - src/core-skills/bmad-advanced-elicitation/SKILL.md
  - src/core-skills/bmad-review/SKILL.md
  - src/core-skills/bmad-customize/SKILL.md
  - src/core-skills/bmad-brainstorming/SKILL.md
  - src/core-skills/bmad-forge-idea/SKILL.md
  - src/core-skills/bmad-party-mode/SKILL.md
  - src/bmm-skills/plan/bmad-project-context/SKILL.md
  - src/bmm-skills/plan/bmad-prd/SKILL.md
  - src/bmm-skills/plan/bmad-spec/SKILL.md
  - src/bmm-skills/plan/bmad-sprint-planning/SKILL.md

equivalent_capabilities:
  product_brief:
    upstream_candidates:
      - bmad-product-brief
      - bmad-create-product-brief
  prd:
    upstream_candidates:
      - bmad-prd
  ux:
    upstream_candidates:
      - bmad-ux
      - bmad-create-ux-design
  architecture:
    upstream_candidates:
      - bmad-architecture
      - bmad-create-architecture
  epics_stories:
    upstream_candidates:
      - bmad-create-epics-and-stories
  implementation:
    upstream_candidates:
      - bmad-create-story
      - bmad-dev-story
      - bmad-code-review
  review:
    upstream_candidates:
      - bmad-review

policy:
  never_delete_upstream: true
  caebmad_overrides_entry_conditions_only: true
  original_skill_content_remains_available: true
