name: CAE-BMAD-Method
version: 1.0.0
kind: overlay-method

base:
  repository: https://github.com/Remjohn/BMAD-METHOD
  preservation: mandatory
  expected_upstream_tree: original-bmad-mandatory.yaml

cae_layer:
  research_target: 216
  artifact_chain:
    - reconstruction
    - operating-level
    - grill
    - product-brief
    - prd
    - fr
    - architecture
    - epics-stories
    - ui
    - brownfield
    - handoff
