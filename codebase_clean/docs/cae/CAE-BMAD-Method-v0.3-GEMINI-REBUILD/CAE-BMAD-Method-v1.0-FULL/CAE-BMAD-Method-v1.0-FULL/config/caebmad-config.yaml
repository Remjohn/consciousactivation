method:
  id: cae-bmad
  version: 1.0.0
  mode: brownfield-reconstruction

research:
  target_sources: 216
  completion_requires_target: true
  baseline_sources: 144
  score_min: 0
  score_max: 100

grill:
  one_question_at_a_time: true
  inspect_before_ask: true
  human_only_questions: true

truth:
  allowed:
    - KNOWN
    - INHERITED
    - VERIFIED
    - PROPOSED
    - INFERRED
    - MISSING
    - CONTRADICTED
    - DEPRECATED

artifacts:
  product_brief: required
  prd_index: required
  prd_modules: required
  functional_requirements: required
  architecture: required
  epics: required
  stories: required
  ui_ux: required
  brownfield_reality_map: required
  implementation_handoff: required
  review_record: required
