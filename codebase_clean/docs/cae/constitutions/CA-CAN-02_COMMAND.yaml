# Object Constitution: Command
# Phase 24 / CA-CAN-02 Constitution Set Completion

id: "CA-EXE-002"
canonical_name: "Command"
status: "DRAFT_PILOT"
version: "0.1.0"
maturity: "development_uncertified"
primary_artifact_class: "Execution Packet"
ontological_plane: "OPERATIONAL_PLANE"
scope_class: "WORKSPACE_SCOPED"
collision_register_ref: "COL-MAP-004"
traceability_matrix_ref: "CA-MAP-01:58, CA-STATE-01:75, 16_CAE_SEMANTIC_OPERATION_API_PROTOCOL.md"

dimensions:
  1_canonical_identity:
    status: "APPLICABLE"
    canonical_id: "CA-EXE-002"
    canonical_name: "Command"
    common_aliases: ["Execution Packet", "Operational Command", "Intent Packet"]
    naming_standard: "PascalCase singular noun entity"
    version: "0.1.0"
    maturity: "development_uncertified"

  2_artifact_class:
    status: "APPLICABLE"
    primary_class: "Execution Packet"
    class_matrix_id: 4
    class_rationale: "Command represents an explicit, structured intent packet requesting an operational mutation, carrying idempotency keys and actor attribution."

  3_ontological_plane:
    status: "APPLICABLE"
    plane: "OPERATIONAL_PLANE"
    plane_rationale: "Acts as the operational entry envelope for all transactional mutations within customer workspaces."

  4_architectural_role:
    status: "APPLICABLE"
    lane: "Command Ingestion & Idempotency"
    primary_purpose: "Enforces at-most-once execution, parameter validation, and actor authorization before routing execution to domain handlers."

  5_definition:
    status: "APPLICABLE"
    genus: "Operational command execution packet"
    differentia: "Distinguished from Event (which records something that already happened) and Receipt (which records execution completion) by representing the incoming request to execute an action."
    function: "Captures command_type, actor_id, parameters, idempotency_key, and execution status."
    boundary: "Must not execute across workspaces without authorization; must enforce idempotency; cannot be deleted during execution."
    normative_definition: >
      Command is an operational execution packet representing an intentional request to perform a state modification.
      It guarantees idempotency via client-supplied idempotency keys and binds every action to an authenticated Actor,
      producing a downstream Receipt upon completion.

  6_semantic_boundary:
    status: "APPLICABLE"
    what_it_is:
      - "An incoming intent packet requesting a state mutation."
      - "The owner of the idempotency token preventing duplicate execution."
      - "The causal trigger for StateTransitions, Events, and Receipts."
    what_it_is_not:
      - "An Event (Event is a past fact; Command is an active request)."
      - "A Receipt (Receipt is the immutable outcome record sealed after execution)."
      - "A HarnessRun (HarnessRun is a multi-step workflow; Command is an atomic operation)."

  7_nearest_neighbors:
    status: "APPLICABLE"
    distinctions:
      - neighbor: "Event (CA-EVT-002 / cae.event)"
        distinction: "Command is an imperative request ('do X'); Event is an indicative fact ('X was done')."
      - neighbor: "Receipt (CA-REC-001)"
        distinction: "Command is the input payload and execution request; Receipt is the sealed evidence of execution."
      - neighbor: "HarnessRun (CA-EXE-001)"
        distinction: "HarnessRun orchestrates long-running composite workflows; Command represents atomic transactional operations."

  8_taxonomic_position:
    status: "APPLICABLE"
    domain: "Execution & Orchestration"
    tier: "Command Ingestion Envelope"
    specialization: "Transactional Semantic Command"

  9_lifecycle_and_canonicity:
    status: "APPLICABLE"
    canonicality: "contextual"
    mutability: "stateful"
    epistemic_status: "established"
    authority_status: "program-governed"
    lifecycle_phases: ["PENDING", "EXECUTING", "COMPLETED", "FAILED", "REJECTED"]

  10_attributes:
    status: "APPLICABLE"
    immutable_attributes:
      - name: "command_id"
        type: "UUID"
        description: "Globally unique identifier for the command."
      - name: "workspace_id"
        type: "UUID"
        description: "Tenant isolation key."
      - name: "actor_id"
        type: "UUID"
        description: "Authenticated caller identifier."
      - name: "command_type"
        type: "STRING"
        description: "Typed semantic operation name (e.g., 'verify_media_asset', 'capture_evidence')."
      - name: "idempotency_key"
        type: "STRING"
        description: "Client-supplied idempotency token."
      - name: "payload"
        type: "JSONB"
        description: "Input parameters for the command."
      - name: "created_at"
        type: "TIMESTAMPTZ"
        description: "Timestamp when command was received."
    mutable_attributes:
      - name: "status"
        type: "STRING"
        description: "Lifecycle execution status (PENDING, EXECUTING, COMPLETED, FAILED, REJECTED)."
      - name: "receipt_id"
        type: "UUID"
        description: "Identifier of resulting Receipt upon completion."
      - name: "error_message"
        type: "STRING"
        description: "Error details if status is FAILED or REJECTED."
      - name: "completed_at"
        type: "TIMESTAMPTZ"
        description: "Timestamp of execution completion."

  11_relationships:
    status: "APPLICABLE"
    parent_chain:
      - parent_object: "Workspace"
        multiplicity: "1"
    root_boundary: "Workspace"
    child_relations:
      - child_object: "Receipt"
        cardinality: "0:1"
      - child_object: "StateTransition"
        cardinality: "0:N"
      - child_object: "Event"
        cardinality: "0:N"

  12_state_model:
    status: "APPLICABLE"
    initial_state: "PENDING"
    terminal_states: ["COMPLETED", "FAILED", "REJECTED"]
    states: ["PENDING", "EXECUTING", "COMPLETED", "FAILED", "REJECTED"]
    transitions:
      - from: "PENDING"
        to: "EXECUTING"
        operation: "start_execution"
      - from: "EXECUTING"
        to: "COMPLETED"
        operation: "complete_execution"
      - from: "EXECUTING"
        to: "FAILED"
        operation: "fail_execution"
      - from: "PENDING"
        to: "REJECTED"
        operation: "reject_command"

  13_events:
    status: "APPLICABLE"
    published_events:
      - event_name: "command.received"
      - event_name: "command.completed"
      - event_name: "command.failed"
    subscribed_events: []

  14_provenance:
    status: "APPLICABLE"
    creation_origin: "API Gateway or Background Worker on incoming HTTP/gRPC request"
    immutable_lineage_required: true
    audit_trail_retention: "PERMANENT"

  15_invariants:
    status: "APPLICABLE"
    rules:
      - "INV-CMD-001: The pair (workspace_id, idempotency_key) MUST be unique; duplicate requests return existing receipt."
      - "INV-CMD-002: payload and command_type are immutable after receipt."
      - "INV-CMD-003: Every COMPLETED command MUST have a non-null receipt_id."
      - "INV-CMD-004: All commands must be attributed to a non-null actor_id."

  16_authority_and_ownership:
    status: "APPLICABLE"
    definition_source: "CA-MAP-01:58, CA-STATE-01:75, 16_CAE_SEMANTIC_OPERATION_API_PROTOCOL.md"
    runtime_representation: "cae.command (PostgreSQL relational)"
    promotion_authority: "API Gateway & Transactional Operation Adapter"

  17_authorized_operations:
    status: "APPLICABLE"
    operations:
      - name: "submit_command"
        parameters: ["workspace_id", "actor_id", "command_type", "idempotency_key", "payload"]
      - name: "cancel_command"
        parameters: ["command_id", "reason"]

  18_prohibited_operations:
    status: "APPLICABLE"
    prohibitions:
      - "MUST NOT re-execute a command with the same idempotency_key."
      - "MUST NOT modify command payload parameters after submission."

  19_validators:
    status: "APPLICABLE"
    structural_validators:
      - "Verify command_id, workspace_id, actor_id are valid UUIDv4."
      - "Verify idempotency_key is non-empty string."
    semantic_validators:
      - "Verify actor_id has permission to execute command_type in target workspace."
      - "Verify idempotency uniqueness in database."

  20_error_taxonomy:
    status: "APPLICABLE"
    errors:
      - code: "ERR_COMMAND_IDEMPOTENCY_CONFLICT"
        http_status: 409
        description: "Duplicate command submitted with active or completed idempotency key."
      - code: "ERR_COMMAND_UNAUTHORIZED"
        http_status: 403
        description: "Actor does not have permission to execute this command."

  21_storage_representation:
    status: "APPLICABLE"
    target_table_projection: "cae.command"
    rls_boundary_column: "workspace_id"
    storage_boundary: "PostgreSQL Relational Storage"

  22_runtime_consumers:
    status: "APPLICABLE"
    consumers:
      - "API Gateway"
      - "Transactional Operation Adapter"
      - "Async Worker Queue"

  23_questions_answered:
    status: "APPLICABLE"
    questions:
      - "What operation was requested, by whom, and with what parameters?"
      - "Has this idempotent request already been processed?"

  24_examples:
    status: "APPLICABLE"
    positive_anchors:
      - id: "EX-CMD-001"
        description: "Submit command to capture evidence from media asset."
        attributes:
          command_id: "120e8400-e29b-41d4-a716-446655440001"
          workspace_id: "11111111-1111-1111-1111-111111111111"
          actor_id: "cc0e8400-e29b-41d4-a716-446655440001"
          command_type: "capture_evidence"
          idempotency_key: "idem-2026-08-26-cap-001"
          status: "COMPLETED"
          receipt_id: "130e8400-e29b-41d4-a716-446655440001"

  25_hard_negatives:
    status: "APPLICABLE"
    deceptive_negatives:
      - id: "NEG-CMD-001"
        description: "Near-miss: Retrying a command with the same idempotency_key but modifying payload parameters to fix a typo."
        rejection_reason: "Violates INV-CMD-001; idempotency keys are strictly bound to identical payloads; parameter changes require a new key."
      - id: "NEG-CMD-002"
        description: "Near-miss: Submitting a command with actor_id set to NULL, claiming it was an anonymous public webhook."
        rejection_reason: "Violates INV-CMD-004; all operational commands must have verifiable actor attribution."
      - id: "NEG-CMD-003"
        description: "Generic violation: Updating command status from COMPLETED back to PENDING."
        rejection_reason: "Violates state model; COMPLETED is a terminal state."

  26_version_history:
    status: "APPLICABLE"
    changelog:
      - version: "0.1.0"
        date: "2026-08-26"
        author: "CAE Governance and Specification Agent (CA-CAN-02)"
        summary: "Initial constitution for Command execution packet with 26 dimensions."
