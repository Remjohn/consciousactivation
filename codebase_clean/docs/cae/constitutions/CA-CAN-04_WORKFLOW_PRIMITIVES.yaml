    lifecycle_phases: ["DRAFT", "PROPOSED", "RATIFIED", "DEPRECATED", "RETIRED"]

  10_attributes:
    status: "APPLICABLE"
    immutable_attributes:
      - name: "primitive_id"
        type: "STRING"
        description: "Canonical primitive identifier (e.g., 'PRIM-SEQ-001', 'PRIM-LOOP-001')."
      - name: "primitive_kind"
        type: "STRING"
        description: "Ratified primitive vocabulary token (SEQUENCE, CONDITION, SWITCH, LOOP, RETRY, PARALLEL, JOIN, TIMEOUT, WAIT, HUMAN_GATE, FAIL, REPAIR, CANCEL, RESUME)."
      - name: "work_unit_kind"
        type: "STRING"
        description: "Work unit kind for execution steps (AGENT_CALL, CODE_FUNCTION, or NOT_APPLICABLE for pure control primitives)."
      - name: "version"
        type: "SEMVER"
        description: "Semantic version string conforming to SemVer 2.0.0 (e.g., '1.0.0')."
      - name: "execution_law"
        type: "STRING"
        description: "Normative deterministic execution rules governing this primitive."
      - name: "failure_behavior"
        type: "STRING"
        description: "Explicit deterministic behavior on failure or error conditions."
      - name: "state_retention_policy"
        type: "STRING"
        description: "Rule specifying whether source state, history, and receipts are preserved upon failure, repair, or retry."
      - name: "checked_transfer_obligations"
        type: "JSONB"
        description: "Specification of ordered transition protocol (edge verification, pre-checks, out-hooks, commit, in-hooks, context refresh)."
      - name: "content_sha256"
        type: "SHA256_HEX"
        description: "Cryptographic SHA-256 digest of the canonical primitive specification."
    mutable_attributes:
