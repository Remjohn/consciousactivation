  14_provenance:
    status: "APPLICABLE"
    creation_origin: "Architecture Governance Committee under Mandate CAE-M57."
    immutable_lineage_required: true
    audit_trail_retention: "PERMANENT"

  15_invariants:
    status: "APPLICABLE"
    rules:
      - "INV-WFP-001: Deterministic Control Flow Law: Code and host runtime own all control-flow decisions (branching, looping, retries, timeouts, joins). AI models and agents MUST NOT dynamically redefine orchestration logic."
      - "INV-WFP-002: Bounded Iteration Law: Every LOOP primitive MUST declare a host-enforced finite bound (max_iterations > 0) and timeout. Agents are strictly prohibited from mutating loop bounds at runtime."
      - "INV-WFP-003: Checked Transfer Law: State transitions follow the 6-stage protocol: (1) valid-edge verification, (2) blocking pre-transfer checks, (3) persistence/out-hooks, (4) edge guards, (5) target state commit, (6) target entry context refresh. Failure of any check MUST retain the source state."
      - "INV-WFP-004: Side-Effect Isolation Law: Parallel branches MUST NOT execute conflicting mutating side effects. Concurrency is permitted only for side-effect classes NONE or READ_ONLY."
      - "INV-WFP-005: Governed Human Gate Law: HUMAN_GATE primitives require explicit, verifiable Operator action in the COMMANDER lane. Agents are prohibited from self-approving human gates."
      - "INV-WFP-006: State-Preserving Repair Law: REPAIR and RETRY primitives MUST retain the source state, record the failed obligation, preserve prior execution receipts, and operate within a bounded retry budget."

  16_authority_and_ownership:
    status: "APPLICABLE"
    definition_source: "Mandate CAE-M57, `docs/cae/CAE_Next_16_Mandate_Bundle/02_WORKFLOW_ENGINEERING/M57_workflow_primitive_constitution.md`"
    runtime_representation: "packages/ca_runtime/src/ca_runtime/workflow_primitives.py"
    promotion_authority: "CAE Architecture Governance Committee / Platform Architecture Lead"

  17_authorized_operations:
    status: "APPLICABLE"
    operations:
      - name: "register_primitive"
        parameters: ["primitive_id", "primitive_kind", "work_unit_kind", "version", "spec_body"]
      - name: "validate_workflow_definition"
        parameters: ["workflow_nodes", "edges", "transition_semantics"]
      - name: "execute_checked_transfer"
        parameters: ["source_state", "target_state", "pre_checks", "guards", "hooks"]

  18_prohibited_operations:
    status: "APPLICABLE"
    prohibitions:
      - "MUST NOT permit unbounded or infinite loops in workflow definitions."
      - "MUST NOT allow runtime agents to increase loop iterations or disable retry budgets."
      - "MUST NOT commit a state transition when a blocking pre-transfer check or hook fails."
      - "MUST NOT execute concurrent parallel branches with conflicting mutable side-effects."
      - "MUST NOT bypass operator authorization on HUMAN_GATE primitives."

  19_validators:
    status: "APPLICABLE"
    structural_validators:
      - "Verify primitive_kind is one of the 14 ratified vocabulary tokens."
      - "Verify work_unit_kind is one of AGENT_CALL, CODE_FUNCTION, or NOT_APPLICABLE."
      - "Verify LoopBoundPolicy has max_iterations > 0."
    semantic_validators:
      - "Verify checked transfer semantics enforce source-state retention on failure."
      - "Verify parallel branches have non-conflicting side-effect classes."
      - "Verify conditions are resolvable by deterministic host predicates."

  20_error_taxonomy:
    status: "APPLICABLE"
    errors:
      - code: "ERR_UNBOUNDED_LOOP"
        http_status: 400
        description: "Workflow contains a LOOP primitive with missing, zero, or negative max_iterations."
      - code: "ERR_AGENT_MUTATED_LOOP_BOUND"
        http_status: 403
        description: "Runtime agent attempted to mutate or override host-enforced loop bounds."
      - code: "ERR_UNEVALUABLE_CONDITION"
        http_status: 422
        description: "Condition expression or predicate cannot be deterministically evaluated by host runtime."
      - code: "ERR_PARALLEL_SIDE_EFFECT_CONFLICT"
        http_status: 409
        description: "Parallel branches contain conflicting non-read-only side-effect declarations."
      - code: "ERR_INVALID_TRANSITION_EDGE"
        http_status: 400
        description: "Attempted transition edge is not declared in the state machine definition."
      - code: "ERR_BLOCKING_PRE_TRANSFER_CHECK_FAILED"
        http_status: 412
        description: "Pre-transfer check failed; transition blocked and run retained in source state."
      - code: "ERR_HUMAN_GATE_BYPASS"
        http_status: 403
        description: "Attempted to advance past a HUMAN_GATE without verified operator authorization."

  21_storage_representation:
    status: "APPLICABLE"
    target_table_projection: "cae.workflow_primitive_definition"
    rls_boundary_column: "NONE (Global canonical plane specification)"
    storage_boundary: "Git repository `docs/cae/constitutions/` + in-memory runtime schema cache"

  22_runtime_consumers:
    status: "APPLICABLE"
    consumers:
      - "UniversalProgramStateRuntime & ProgramStateMachineDefinition"
      - "RuntimeWorkflowCompiler & Scheduler"
      - "ProgramOperatorRuntimeService"
      - "BoundedRepairRuntimeEngine"

  23_questions_answered:
    status: "APPLICABLE"
    questions:
      - "What are the deterministic execution laws and failure semantics for this workflow step?"
      - "What exact checks, hooks, and persistence actions must succeed before state is committed?"
      - "Are parallel branches safe to execute concurrently without data races or conflicting side effects?"

  24_examples:
    status: "APPLICABLE"
    positive_anchors:
      - id: "EX-WFP-001"
        description: "Bounded LOOP primitive executing an Analyst repair cycle up to 3 times."
        attributes:
          primitive_kind: "LOOP"
          work_unit_kind: "AGENT_CALL"
          loop_bound_policy:
            max_iterations: 3
            timeout_seconds: 300
            allow_agent_override: false
          failure_behavior: "ABORT_TO_REPAIR_OR_FAIL"
          state_retention_policy: "PRESERVE_SOURCE_STATE"

      - id: "EX-WFP-002"
        description: "Checked transfer CONDITION branching between COMPOSITION and HUMAN_GATE."
        attributes:
          primitive_kind: "CONDITION"
          work_unit_kind: "CODE_FUNCTION"
          condition_expression: "eval_score >= 85"
          then_step_id: "STEP_APPROVE_GATE"
          else_step_id: "STEP_REPAIR_LOOP"

  25_hard_negatives:
    status: "APPLICABLE"
    deceptive_negatives:
      - id: "NEG-WFP-001"
        description: "A workflow LOOP configured with max_iterations = 0 or relying on an LLM prompt to decide when to stop without host bounds."
        rejection_reason: "Violates INV-WFP-002; loops must have host-enforced positive finite bounds."
      - id: "NEG-WFP-002"
        description: "A state transition that advances current_state to TARGET before evaluating pre-transfer hooks, reverting on failure."
        rejection_reason: "Violates INV-WFP-003 and Checked Transfer Law; pre-transfer checks must pass BEFORE committing target state."
      - id: "NEG-WFP-003"
        description: "A PARALLEL primitive spawning two branches that both execute MUTATION_OPERATION on the same aggregate."
        rejection_reason: "Violates INV-WFP-004; concurrent branches must be strictly isolated to NONE or READ_ONLY side effects."

  26_version_history:
