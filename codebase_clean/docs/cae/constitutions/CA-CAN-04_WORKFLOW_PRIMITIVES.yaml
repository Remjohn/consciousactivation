  2_artifact_class:
    status: "APPLICABLE"
    primary_class: "Canonical Control Flow Primitive"
    class_matrix_id: 11
    class_rationale: "WorkflowPrimitive defines the deterministic vocabulary, execution laws, failure/termination rules, checked transfer semantics, and state invariants governing workflow execution across the Conscious Activation Engine."

  3_ontological_plane:
    status: "APPLICABLE"
    plane: "CANONICAL_PLANE"
    plane_rationale: "Resides on the Canonical Plane as global system doctrine governing deterministic workflow orchestration; contains zero tenant data, runtime states, or private credentials."

  4_architectural_role:
    status: "APPLICABLE"
    lane: "Deterministic Control Flow & Orchestration Law"
    primary_purpose: "Enforces the architectural doctrine that code owns deterministic control flow, Agents own bounded reasoning within steps, Skills remain passive, and State transitions follow checked transfer semantics."

  5_definition:
    status: "APPLICABLE"
    genus: "Canonical workflow control-flow primitive and execution contract"
    differentia: "Distinguished from Agent (which performs bounded cognitive reasoning within a step) by specifying deterministic orchestration logic; distinguished from StateAggregate (which holds mutable runtime version state) by defining immutable orchestration semantics; distinguished from Program (which is the operator-addressable work unit) by providing the atomic control-flow building blocks."
    function: "Specifies deterministic execution mechanics, branching conditions, host-enforced iteration bounds, concurrency isolation, and checked state transitions for workflow execution graphs."
    boundary: "Must not permit models or agents to mutate control laws or loop bounds; must not bypass checked transfer semantics; must not permit unhandled side-effect conflicts in parallel execution."
    normative_definition: >
      WorkflowPrimitive is a Global Canonical Control Flow Specification that ratifies the formal vocabulary of deterministic
      workflow primitives (SEQUENCE, CONDITION, SWITCH, LOOP, RETRY, PARALLEL, JOIN, TIMEOUT, WAIT, HUMAN_GATE, FAIL,
      REPAIR, CANCEL, RESUME) and work-unit kinds (AGENT_CALL, CODE_FUNCTION). It enforces host-controlled orchestration,
      bounded iterations, side-effect isolation, and checked state transfer semantics under the StateM Alignment Contract.

  6_semantic_boundary:
    status: "APPLICABLE"
    what_it_is:
      - "The immutable canonical specification of deterministic control-flow primitives."
      - "The definition of valid execution mechanics, termination criteria, and error semantics for workflow graphs."
      - "The contract for checked transfer semantics across state boundaries (edge check -> pre-checks -> out-hooks -> commit -> in-hooks)."
      - "A governed framework ensuring models reason inside steps rather than defining the workflow engine."
    what_it_is_not:
      - "A prompt or cognitive reasoning model (that is `Agent`)."
      - "A mutable per-run execution record or state container (that is `StateAggregate` or `ProgramStateAggregate`)."
      - "A passive procedural skill document (that is `Skill`)."
      - "An ad-hoc loop or unconstrained orchestration script."

  7_nearest_neighbors:
    status: "APPLICABLE"
    distinctions:
      - neighbor: "Agent (CA-AGT-001)"
        distinction: "Agent owns bounded cognitive reasoning within an AGENT_CALL work unit; WorkflowPrimitive defines the deterministic structure calling the Agent."
      - neighbor: "StateTransitionContract (CA-POL-002)"
        distinction: "StateTransitionContract defines atomic lifecycle state transitions for an aggregate; WorkflowPrimitive defines multi-step control flow and checked transfer ordering."
      - neighbor: "Program (CA-PRG-001)"
        distinction: "Program is the operator-addressable unit of work binding Agents and workflows to phases; WorkflowPrimitive provides the atomic control flow language."
      - neighbor: "HarnessTemplate (CA-STR-001)"
        distinction: "HarnessTemplate is a declarative blueprint compiling into an executable workflow IR; WorkflowPrimitive is the vocabulary of primitive nodes."

  8_taxonomic_position:
    status: "APPLICABLE"
    domain: "Workflow Engineering & Control Flow Foundation"
    tier: "Global Canonical Orchestration Specification"
    specialization: "Deterministic Workflow Control Primitive"

  9_lifecycle_and_canonicity:
    status: "APPLICABLE"
    canonicality: "canonical"
    mutability: "versioned"
