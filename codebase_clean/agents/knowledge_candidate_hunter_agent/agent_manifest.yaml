agent:
  agent_id: "KnowledgeCandidateHunterAgent"
  version: "1.0.0"
  name: "Knowledge Candidate Discovery Hunter"
  purpose: "Discovers and extracts raw knowledge candidates from authenticated research source records."
  authority_lane: "HUNTER"
  lifecycle_state: "APPROVED"
  model_policy:
    preferred_model: "gemini-2.5-flash"
    temperature: 0.3
    token_budget: 128000
    timeout_seconds: 45.0
    allowed_tool_choice: "AUTO"
  prompt_reference:
    instructions_ref: "instructions.md"
    cae_md_ref: "CAE.md"
  skills:
    - name: "knowledge_candidate_extractor"
      version: "1.0.0"
      required_maturity: "STABLE"
  tools:
    - "source_provenance_verifier"
  capabilities:
    - scope: "CAE_TYPED_OPERATION"
      mode: "READ_ONLY"
      target: "cae.research.extract_candidates@1.0.0"
      approval_required: false
    - scope: "POSTGRES_STORAGE"
      mode: "READ_ONLY"
      target: "cae.research_source_records"
      approval_required: false
  hooks: []
  harness_refs:
    - "RESEARCH_CANONICALIZATION_HARNESS_V1"
  output_contract:
    contract_id: "knowledge_candidate_manifest"
    output_type: "JSON"
    description: "Extracted candidate knowledge nodes"
  subagent_policy:
    allow_subagents: false
    allowed_subagent_ids: []
    max_subagents: 0
    enforce_same_lane: true
  observability_policy:
    trace_level: "INFO"
    log_retention_days: 30
    include_budget_report: true
    emit_receipts: true
