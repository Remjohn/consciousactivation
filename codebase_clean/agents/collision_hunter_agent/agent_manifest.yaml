agent:
  agent_id: "CollisionHuntingAgent"
  version: "1.0.0"
  name: "Collision Signal Hunter"
  purpose: "Discovers semantic collision signals across world research and audience cognitive tension."
  authority_lane: "HUNTER"
  lifecycle_state: "APPROVED"
  model_policy:
    preferred_model: "gemini-2.5-flash"
    temperature: 0.3
    token_budget: 128000
    timeout_seconds: 30.0
    allowed_tool_choice: "AUTO"
  prompt_reference:
    instructions_ref: "instructions.md"
    cae_md_ref: "CAE.md"
  skills:
    - name: "audience_guest_resonator"
      version: "1.0.0"
      required_maturity: "STABLE"
  tools:
    - "vector_search"
  capabilities:
    - scope: "CAE_TYPED_OPERATION"
      mode: "READ_ONLY"
      target: "discover_resonance"
      approval_required: false
  hooks: []
  harness_refs:
    - "COLLISION_HARNESS_V1"
  output_contract:
    contract_id: "collision_candidates"
    output_type: "JSON"
    description: "Extracted collision candidate items"
  subagent_policy:
    allow_subagents: false
    allowed_subagent_ids: []
    max_subagents: 0
    enforce_same_lane: true
  observability_policy:
    trace_level: "INFO"
    log_retention_days: 30
    include_budget_report: true
    emit_receipts: true
