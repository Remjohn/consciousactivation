agent:
  agent_id: "RelationshipCanonicalizationAnalystAgent"
  version: "1.0.0"
  name: "Knowledge Relationship Canonicalization Analyst"
  purpose: "Analyzes semantic relations, detects false merges, and verifies ontological compatibility of knowledge candidates."
  authority_lane: "ANALYST"
  lifecycle_state: "APPROVED"
  model_policy:
    preferred_model: "gemini-2.5-pro"
    temperature: 0.1
    token_budget: 128000
    timeout_seconds: 45.0
    allowed_tool_choice: "AUTO"
  prompt_reference:
    instructions_ref: "instructions.md"
    cae_md_ref: "CAE.md"
  skills:
    - name: "canonical_relationship_classifier"
      version: "1.0.0"
      required_maturity: "STABLE"
  tools:
    - "semantic_similarity_analyzer"
  capabilities:
    - scope: "CAE_TYPED_OPERATION"
      mode: "READ_ONLY"
      target: "cae.research.canonicalize@1.0.0"
      approval_required: false
    - scope: "POSTGRES_STORAGE"
      mode: "READ_ONLY"
      target: "cae.canonical_knowledge_nodes"
      approval_required: false
  hooks: []
  harness_refs:
    - "RESEARCH_CANONICALIZATION_HARNESS_V1"
  output_contract:
    contract_id: "relationship_analysis_receipt"
    output_type: "JSON"
    description: "Evaluated relationship matrix and contradiction flags"
  subagent_policy:
    allow_subagents: false
    allowed_subagent_ids: []
    max_subagents: 0
    enforce_same_lane: true
  observability_policy:
    trace_level: "INFO"
    log_retention_days: 30
    include_budget_report: true
    emit_receipts: true
