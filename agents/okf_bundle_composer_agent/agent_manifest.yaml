agent:
  agent_id: "OKFBundleComposerAgent"
  version: "1.0.0"
  name: "OKF Knowledge Bundle Composer"
  purpose: "Synthesizes analyzed canonical knowledge items into validated OKF markdown bundle packages."
  authority_lane: "COMPOSER"
  lifecycle_state: "APPROVED"
  model_policy:
    preferred_model: "gemini-2.5-pro"
    temperature: 0.2
    token_budget: 128000
    timeout_seconds: 45.0
    allowed_tool_choice: "AUTO"
  prompt_reference:
    instructions_ref: "instructions.md"
    cae_md_ref: "CAE.md"
  skills:
    - name: "okf_bundle_projector"
      version: "1.0.0"
      required_maturity: "STABLE"
  tools:
    - "okf_markdown_renderer"
  capabilities:
    - scope: "CAE_TYPED_OPERATION"
      mode: "READ_WRITE"
      target: "cae.research.project_okf@1.0.0"
      approval_required: false
    - scope: "POSTGRES_STORAGE"
      mode: "READ_WRITE"
      target: "cae.okf_knowledge_bundles"
      approval_required: false
  hooks: []
  harness_refs:
    - "RESEARCH_CANONICALIZATION_HARNESS_V1"
  output_contract:
    contract_id: "okf_knowledge_bundle"
    output_type: "JSON"
    description: "Structured OKF knowledge bundle artifact"
  subagent_policy:
    allow_subagents: false
    allowed_subagent_ids: []
    max_subagents: 0
    enforce_same_lane: true
  observability_policy:
    trace_level: "INFO"
    log_retention_days: 30
    include_budget_report: true
    emit_receipts: true
