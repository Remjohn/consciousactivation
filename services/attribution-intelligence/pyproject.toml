[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cae-attribution-intelligence"
version = "0.1.0"
description = "CAE Attribution Intelligence: Semantic Annotation & Evidence Classification Layer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
