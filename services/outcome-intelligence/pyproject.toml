[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cae-outcome-intelligence"
version = "0.1.0"
description = "CAE Outcome Intelligence: Closed-Loop Outcome Measurement & Selective Learning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
