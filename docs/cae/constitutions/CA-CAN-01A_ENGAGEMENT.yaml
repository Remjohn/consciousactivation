# Object Constitution: Engagement
# Phase 04 / CA-CAN-01A Boundary & Access Constitutions

id: "CA-ENT-004"
canonical_name: "Engagement"
status: "DRAFT_PILOT"
version: "0.1.0"
maturity: "development_uncertified"
primary_artifact_class: "Entity"
ontological_plane: "OPERATIONAL_PLANE"
scope_class: "ENGAGEMENT_SCOPED"
collision_register_ref: "COL-MAP-001"

dimensions:
  1_canonical_identity:
    status: "APPLICABLE"
    canonical_id: "CA-ENT-004"
    canonical_name: "Engagement"
    common_aliases: ["Campaign", "Project Container", "Activation Engagement"]
    naming_standard: "PascalCase singular noun entity"
    version: "0.1.0"
    maturity: "development_uncertified"

  2_artifact_class:
    status: "APPLICABLE"
    primary_class: "Entity"
    class_matrix_id: 1
    class_rationale: "Engagement has discrete identity, stateful execution lifecycle, operational containment of sessions/media, and is subordinate to a Workspace."

  3_ontological_plane:
    status: "APPLICABLE"
    plane: "OPERATIONAL_PLANE"
    plane_rationale: "Serves as the operational campaign and project container within a customer workspace."

  4_architectural_role:
    status: "APPLICABLE"
    lane: "Campaign & Project Execution"
    primary_purpose: "Groups related interview flows, activation plans, media assets, transcripts, and evaluation runs under a single project boundary."

  5_definition:
    status: "APPLICABLE"
    genus: "Operational campaign container entity"
    differentia: "Distinguished from Workspace in that Workspace is the tenant isolation boundary, while Engagement is a subordinate project container inside one Workspace."
    function: "Provides project-level grouping, lifecycle tracking, and workflow configuration for multi-interview customer activations."
    boundary: "Must not span multiple Workspaces; is NOT a secondary tenant isolation boundary; does not isolate security credentials."
    normative_definition: >
      Engagement is the operational project container within a single Workspace that bounds a cohesive campaign,
      study, or activation workflow. It groups interview sessions, participants, media assets, and derived insights
      while inheriting the strict isolation and security boundary of its parent Workspace.

  6_semantic_boundary:
    status: "APPLICABLE"
    what_it_is:
      - "A bounded project or campaign container inside a specific Workspace."
      - "The grouping root for interview sessions, activations, and campaign assets."
    what_it_is_not:
      - "A tenant isolation boundary (Workspace is the tenant boundary)."
      - "A global campaign spanning multiple client Workspaces."
      - "An interview session (InterviewSession is an individual interaction)."

  7_nearest_neighbors:
    status: "APPLICABLE"
    distinctions:
      - neighbor: "Workspace (CA-ENT-001)"
        distinction: "Workspace is the primary client tenant boundary; Engagement is a project container inside a Workspace."
      - neighbor: "InterviewSession (CA-ENT-005)"
        distinction: "Engagement is the overall campaign container; InterviewSession is an individual interview execution."
      - neighbor: "Campaign (Brownfield legacy model)"
        distinction: "Engagement is the canonical target entity replacing legacy Campaign models while preserving Workspace containment."

  8_taxonomic_position:
    status: "APPLICABLE"
    domain: "Campaign Management"
    tier: "Workspace Subordinate Container"
    specialization: "Standard Engagement Entity"

  9_lifecycle_and_canonicity:
    status: "APPLICABLE"
    canonicality: "contextual"
    mutability: "stateful"
    epistemic_status: "established"
    authority_status: "program-governed"
    lifecycle_phases: ["DRAFT", "ACTIVE", "PAUSED", "COMPLETED", "ARCHIVED"]

  10_attributes:
    status: "APPLICABLE"
    immutable_attributes:
      - name: "engagement_id"
        type: "UUID"
        description: "Primary unique identifier for the engagement."
      - name: "workspace_id"
        type: "UUID"
        description: "Foreign key to the containing parent Workspace."
      - name: "created_at"
        type: "TIMESTAMPTZ"
        description: "Creation timestamp."
    mutable_attributes:
      - name: "engagement_name"
        type: "STRING"
        description: "Human-readable title of the campaign or study."
      - name: "status"
        type: "STRING"
        description: "Lifecycle status (DRAFT, ACTIVE, PAUSED, COMPLETED, ARCHIVED)."
      - name: "configuration"
        type: "JSONB"
        description: "Campaign parameters, prompt templates, and interview rules."
      - name: "updated_at"
        type: "TIMESTAMPTZ"
        description: "Timestamp of last modification."

  11_relationships:
    status: "APPLICABLE"
    parent_chain: ["Workspace"]
    root_boundary: "Workspace"
    child_relations:
      - child_object: "InterviewSession"
        cardinality: "1:N"
      - child_object: "MediaAsset"
        cardinality: "1:N"

  12_state_model:
    status: "APPLICABLE"
    initial_state: "DRAFT"
    terminal_states: ["ARCHIVED"]
    states: ["DRAFT", "ACTIVE", "PAUSED", "COMPLETED", "ARCHIVED"]
    transitions:
      - from: "DRAFT"
        to: "ACTIVE"
        operation: "launch_engagement"
      - from: "ACTIVE"
        to: "PAUSED"
        operation: "pause_engagement"
      - from: "PAUSED"
        to: "ACTIVE"
        operation: "resume_engagement"
      - from: "ACTIVE"
        to: "COMPLETED"
        operation: "complete_engagement"
      - from: "COMPLETED"
        to: "ARCHIVED"
        operation: "archive_engagement"

  13_events:
    status: "APPLICABLE"
    published_events:
      - event_name: "engagement.launched"
      - event_name: "engagement.paused"
      - event_name: "engagement.completed"
      - event_name: "engagement.archived"
    subscribed_events:
      - event_name: "workspace.suspended"
      - event_name: "workspace.purged"

  14_provenance:
    status: "APPLICABLE"
    creation_origin: "Workspace member creation via Campaign/Engagement service"
    immutable_lineage_required: true
    audit_trail_retention: "PERMANENT"

  15_invariants:
    status: "APPLICABLE"
    rules:
      - "INV-ENG-001: Every Engagement MUST belong to exactly one Workspace (workspace_id)."
      - "INV-ENG-002: An Engagement MUST NEVER contain interview sessions or media assets from another Workspace."
      - "INV-ENG-003: Deleting or archiving an Engagement does not affect peer Engagements in the same Workspace."

  16_authority_and_ownership:
    status: "APPLICABLE"
    definition_source: "CAE Multi-Tenant Plan §1; CA-MAP-01 Scope & Authority Matrix"
    runtime_representation: "cae.engagement (Proposed Phase 08 schema)"
    promotion_authority: "Workspace Administrator"

  17_authorized_operations:
    status: "APPLICABLE"
    operations:
      - name: "create_engagement"
        parameters: ["workspace_id", "engagement_name", "configuration"]
      - name: "update_engagement_config"
        parameters: ["engagement_id", "configuration"]
      - name: "transition_engagement_status"
        parameters: ["engagement_id", "target_state"]

  18_prohibited_operations:
    status: "APPLICABLE"
    prohibitions:
      - "MUST NOT create an Engagement without a valid parent Workspace."
      - "MUST NOT transfer an Engagement to a different Workspace."
      - "MUST NOT treat Engagement as a separate tenant boundary."

  19_validators:
    status: "APPLICABLE"
    structural_validators:
      - "Verify engagement_id and workspace_id are valid UUIDs."
      - "Verify engagement_name is non-empty string."
    semantic_validators:
      - "Ensure parent workspace_id exists and is ACTIVE."
      - "Ensure RLS policy enforces workspace_id isolation on engagement rows."

  20_error_taxonomy:
    status: "APPLICABLE"
    errors:
      - code: "ERR_ENGAGEMENT_NOT_FOUND"
        http_status: 404
        description: "Target engagement does not exist."
      - code: "ERR_ENGAGEMENT_INVALID_STATE"
        http_status: 422
        description: "Requested action is invalid for current engagement state."
      - code: "ERR_ENGAGEMENT_CROSS_WORKSPACE"
        http_status: 403
        description: "Cross-workspace engagement association prohibited."

  21_storage_representation:
    status: "APPLICABLE"
    target_table_projection: "cae.engagement"
    rls_boundary_column: "workspace_id"
    storage_boundary: "storage://cae-media/<workspace_id>/engagements/<engagement_id>/"

  22_runtime_consumers:
    status: "APPLICABLE"
    consumers:
      - "Interview Service"
      - "Campaign Management API"
      - "AIR Processing Pipeline"

  23_questions_answered:
    status: "APPLICABLE"
    questions:
      - "Which campaign or project bounds this interview flow?"
      - "What prompt configurations and activation settings govern this batch of sessions?"

  24_examples:
    status: "APPLICABLE"
    positive_anchors:
      - id: "EX-ENG-001"
        description: "Customer employee feedback activation campaign."
        attributes:
          engagement_id: "44444444-4444-4444-4444-444444444444"
          workspace_id: "11111111-1111-1111-1111-111111111111"
          engagement_name: "Q3 Cultural Activation Study"
          status: "ACTIVE"

  25_hard_negatives:
    status: "APPLICABLE"
    deceptive_negatives:
      - id: "NEG-ENG-001"
        description: "Attempting to create a global Engagement shared across multiple Workspaces."
        rejection_reason: "Violates INV-ENG-001 and INV-ENG-002; Engagement is strictly single-workspace scoped."
      - id: "NEG-ENG-002"
        description: "Treating Engagement as a replacement for Workspace tenant isolation."
        rejection_reason: "Violates semantic boundary; Workspace is the sole tenant boundary."

  26_version_history:
    status: "APPLICABLE"
    changelog:
      - version: "0.1.0"
        date: "2026-08-25"
        author: "CAE Governance and Specification Agent (CA-CAN-01A)"
        summary: "Initial draft constitution establishing Engagement as workspace-subordinate campaign entity."
