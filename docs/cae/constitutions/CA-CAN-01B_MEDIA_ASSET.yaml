# Object Constitution: MediaAsset
# Phase 05 / CA-CAN-01B Guest & Evidence Constitutions

id: "CA-ENT-002"
canonical_name: "MediaAsset"
status: "DRAFT_PILOT"
version: "0.1.0"
maturity: "development_uncertified"
primary_artifact_class: "Entity"
ontological_plane: "OPERATIONAL_PLANE"
scope_class: "WORKSPACE_SCOPED"
collision_register_ref: "COL-MAP-003"

dimensions:
  1_canonical_identity:
    status: "APPLICABLE"
    canonical_id: "CA-ENT-002"
    canonical_name: "MediaAsset"
    common_aliases: ["Media Item", "Recorded Audio Asset", "Video Asset Entity", "Ingested Media"]
    naming_standard: "PascalCase singular compound entity noun"
    version: "0.1.0"
    maturity: "development_uncertified"

  2_artifact_class:
    status: "APPLICABLE"
    primary_class: "Entity"
    class_matrix_id: 1
    class_rationale: "MediaAsset possesses discrete operational identity, manages the relational lifecycle and access metadata of ingested media within a Workspace, and maintains continuity across state transitions (STAGED, VERIFIED, QUARANTINED, RETIRED)."

  3_ontological_plane:
    status: "APPLICABLE"
    plane: "OPERATIONAL_PLANE"
    plane_rationale: "Maintains relational metadata and lifecycle state for operational media files in a client workspace; does not exist on the Global Canonical Plane."

  4_architectural_role:
    status: "APPLICABLE"
    lane: "Media Ingestion, Provenance & Asset Lifecycle"
    primary_purpose: "Provides a governed relational metadata entity for ingested audio/video recordings, content-addressing digests, MIME types, storage references, and access policies, strictly separated from raw byte storage and semantic claims."

  5_definition:
    status: "APPLICABLE"
    genus: "Operational media metadata and lifecycle entity"
    differentia: "Distinguished from raw storage bytes (ImmutableMediaEvidence), semantic claims (EvidenceItem/EvidenceSpan), and transient URLs by tracking durable relational metadata, acquisition provenance, storage locators, and lifecycle states in PostgreSQL."
    function: "Governs the verification lifecycle, access policies, retention parameters, and storage references for media files uploaded or ingested into a Workspace."
    boundary: "Does not contain raw binary bytes (stored in private object storage); does not represent semantic assertions (represented in EvidenceItem); URLs are ephemeral locators and not evidence of authenticity."
    normative_definition: >
      MediaAsset is a Workspace-scoped operational Entity that manages the relational identity, lifecycle state, acquisition provenance,
      MIME parameters, content hash, and private storage locator for an ingested audio/video file. It enforces strict verification
      boundaries requiring fresh-read SHA-256 byte comparison before entering VERIFIED state, and isolates metadata management from
      raw binary payload storage and downstream semantic claims.

  6_semantic_boundary:
    status: "APPLICABLE"
    what_it_is:
      - "The relational database record managing media lifecycle, format, size, and content hash."
      - "The owner of private object storage locators (storage://cae-media/<workspace_id>/...)."
      - "The subject of verification transitions (STAGED -> VERIFIED -> QUARANTINED -> RETIRED)."
    what_it_is_not:
      - "The raw binary payload itself (that is ImmutableMediaEvidence)."
      - "A semantic evidence claim or transcript assertion (that is EvidenceItem)."
      - "A signed download URL (a URL is an ephemeral locator, not authenticity proof)."
      - "A global asset shared across tenants."

  7_nearest_neighbors:
    status: "APPLICABLE"
    distinctions:
      - neighbor: "ImmutableMediaEvidence (CA-EVI-001)"
        distinction: "MediaAsset is the mutable relational lifecycle/metadata record; ImmutableMediaEvidence is the cryptographically immutable byte payload in object storage."
      - neighbor: "EvidenceItem (CA-EVI-002 / Operational Entity)"
        distinction: "MediaAsset represents the media file container; EvidenceItem represents the semantic claim or observation extracted from the media."
      - neighbor: "EvidenceSource (CA-REL-004)"
        distinction: "MediaAsset tracks the specific media file; EvidenceSource represents the upstream package/adapter envelope connecting external systems."

  8_taxonomic_position:
    status: "APPLICABLE"
    domain: "Media Management & Asset Governance"
    tier: "Workspace-Scoped Operational Entity"
    specialization: "Content-Addressed Media Asset"

  9_lifecycle_and_canonicity:
    status: "APPLICABLE"
    canonicality: "contextual"
    mutability: "stateful"
    epistemic_status: "established"
    authority_status: "program-governed"
    lifecycle_phases: ["STAGED", "VERIFIED", "QUARANTINED", "RETIRED"]

  10_attributes:
    status: "APPLICABLE"
    immutable_attributes:
      - name: "media_asset_id"
        type: "UUID"
        description: "Primary unique identifier for the media asset."
      - name: "workspace_id"
        type: "UUID"
        description: "Foreign key anchoring the asset strictly to its parent Workspace."
      - name: "storage_path"
        type: "STRING"
        description: "Deterministic storage URI (e.g. 'storage://cae-media/<workspace_id>/assets/<sha256>.<ext>')."
      - name: "canonical_sha256"
        type: "SHA256_HEX"
        description: "Cryptographic SHA-256 digest computed from fresh-read binary bytes."
      - name: "byte_size"
        type: "INTEGER"
        description: "Exact size of binary payload in bytes."
      - name: "mime_type"
        type: "STRING"
        description: "Governed MIME type (e.g., 'audio/wav', 'video/mp4')."
      - name: "created_at"
        type: "TIMESTAMPTZ"
        description: "Timestamp when asset record was staged."
    mutable_attributes:
      - name: "status"
        type: "STRING"
        description: "Lifecycle status (STAGED, VERIFIED, QUARANTINED, RETIRED)."
      - name: "acquisition_context"
        type: "JSONB"
        description: "Source device, interview turn reference, sample rate, and channel metadata."
      - name: "retention_policy"
        type: "JSONB"
        description: "Governed retention window and legal hold flags."
      - name: "updated_at"
        type: "TIMESTAMPTZ"
        description: "Timestamp of last modification."

  11_relationships:
    status: "APPLICABLE"
    parent_chain: ["Workspace"]
    root_boundary: "Workspace"
    child_relations:
      - child_object: "ImmutableMediaEvidence"
        cardinality: "1:1"
      - child_object: "EvidenceSpan"
        cardinality: "0:N"
      - child_object: "EvidenceItem"
        cardinality: "0:N"

  12_state_model:
    status: "APPLICABLE"
    initial_state: "STAGED"
    terminal_states: ["RETIRED"]
    states: ["STAGED", "VERIFIED", "QUARANTINED", "RETIRED"]
    transitions:
      - from: "STAGED"
        to: "VERIFIED"
        operation: "verify_media_asset"
      - from: "STAGED"
        to: "QUARANTINED"
        operation: "quarantine_media_asset"
      - from: "VERIFIED"
        to: "QUARANTINED"
        operation: "quarantine_media_asset"
      - from: "QUARANTINED"
        to: "VERIFIED"
        operation: "reverify_media_asset"
      - from: "VERIFIED"
        to: "RETIRED"
        operation: "retire_media_asset"

  13_events:
    status: "APPLICABLE"
    published_events:
      - event_name: "media_asset.staged"
      - event_name: "media_asset.verified"
      - event_name: "media_asset.quarantined"
      - event_name: "media_asset.retired"
    subscribed_events:
      - event_name: "workspace.purged"

  14_provenance:
    status: "APPLICABLE"
    creation_origin: "Direct client upload via presigned URL or Interview Expression ingestion bridge"
    immutable_lineage_required: true
    audit_trail_retention: "PERMANENT"

  15_invariants:
    status: "APPLICABLE"
    rules:
      - "INV-MED-001: Every MediaAsset MUST belong to exactly one Workspace (workspace_id)."
      - "INV-MED-002: Transition to VERIFIED state MUST NEVER occur without fresh-read byte readback and digest match."
      - "INV-MED-003: MediaAsset relational metadata is distinct from raw payload bytes (ImmutableMediaEvidence) and claims (EvidenceItem)."
      - "INV-MED-004: In RETIRED or QUARANTINED state, the system MUST refuse generation of client access URLs."
      - "INV-MED-005: New media content or modified bytes MUST NEVER overwrite an existing MediaAsset row; they require a distinct asset identity."

  16_authority_and_ownership:
    status: "APPLICABLE"
    definition_source: "Builder ADR-003; Multi-Tenant Plan §3.2; Phase 0 Object Constitution Protocol; CA-MAP-01 Matrix"
    runtime_representation: "cae.media_asset (PostgreSQL metadata table scoped by workspace_id)"
    promotion_authority: "Media Ingestion Service / Workspace Administrator via typed semantic operations"

  17_authorized_operations:
    status: "APPLICABLE"
    operations:
      - name: "stage_media_asset"
        parameters: ["workspace_id", "storage_path", "canonical_sha256", "byte_size", "mime_type", "acquisition_context"]
      - name: "verify_media_asset"
        parameters: ["media_asset_id", "readback_sha256", "readback_byte_size"]
      - name: "quarantine_media_asset"
        parameters: ["media_asset_id", "quarantine_reason"]
      - name: "retire_media_asset"
        parameters: ["media_asset_id", "retire_receipt"]

  18_prohibited_operations:
    status: "APPLICABLE"
    prohibitions:
      - "MUST NOT mark a MediaAsset VERIFIED purely based on HTTP upload response code (e.g. 200/201) without byte readback."
      - "MUST NOT generate signed URLs for assets in QUARANTINED or RETIRED states."
      - "MUST NOT mutate canonical_sha256 or byte_size after asset creation."
      - "MUST NOT permit cross-workspace media asset sharing without explicit compliance crosswalk."

  19_validators:
    status: "APPLICABLE"
    structural_validators:
      - "Verify media_asset_id and workspace_id are valid UUIDv4 strings."
      - "Verify canonical_sha256 is a 64-character lowercase hex string."
      - "Verify byte_size is a positive integer > 0."
    semantic_validators:
      - "Ensure storage_path conforms to deterministic workspace pattern 'storage://cae-media/<workspace_id>/...'."
      - "Ensure readback hash matches canonical_sha256 during verify_media_asset."

  20_error_taxonomy:
    status: "APPLICABLE"
    errors:
      - code: "ERR_MEDIA_HASH_MISMATCH"
        http_status: 422
        description: "Fresh-read byte hash does not match recorded canonical SHA-256 digest."
      - code: "ERR_MEDIA_QUARANTINED"
        http_status: 403
        description: "Access to media asset rejected because asset is quarantined."
      - code: "ERR_MEDIA_ACCESS_CROSS_WORKSPACE"
        http_status: 403
        description: "Cross-workspace media access attempt prohibited by RLS policy."

  21_storage_representation:
    status: "APPLICABLE"
    target_table_projection: "cae.media_asset"
    rls_boundary_column: "workspace_id"
    storage_boundary: "storage://cae-media/<workspace_id>/assets/<media_asset_id>/"

  22_runtime_consumers:
    status: "APPLICABLE"
    consumers:
      - "Media Ingestion Service"
      - "Interview Expression Bridge"
      - "AIR Processing Pipeline"

  23_questions_answered:
    status: "APPLICABLE"
    questions:
      - "What media files exist within this Workspace and what is their verification status?"
      - "What is the content hash, byte size, format, and storage locator for this recorded audio/video?"

  24_examples:
    status: "APPLICABLE"
    positive_anchors:
      - id: "EX-MED-001"
        description: "Verified audio recording from an interview session."
        attributes:
          media_asset_id: "88888888-8888-8888-8888-888888888888"
          workspace_id: "11111111-1111-1111-1111-111111111111"
          storage_path: "storage://cae-media/11111111-1111-1111-1111-111111111111/assets/a1b2c3d4e5f6.wav"
          canonical_sha256: "a1b2c3d4e5f67890123456789abcdef0123456789abcdef0123456789abcdef0"
          byte_size: 5242880
          mime_type: "audio/wav"
          status: "VERIFIED"

  25_hard_negatives:
    status: "APPLICABLE"
    deceptive_negatives:
      - id: "NEG-MED-001"
        description: "Treating a presigned S3 upload URL or HTTP 200 response as proof of verified evidence."
        rejection_reason: "Violates INV-MED-002 and Section 5; a URL is an ephemeral locator, not authenticity proof; verification requires byte readback and SHA-256 match."
      - id: "NEG-MED-002"
        description: "Marking a media asset VERIFIED in the database when the storage object does not exist or has zero bytes."
        rejection_reason: "Violates COL-MAP-003 and Section 5; database state cannot self-attest storage reality without fresh-read verification."

  26_version_history:
    status: "APPLICABLE"
    changelog:
      - version: "0.1.0"
        date: "2026-08-25"
        author: "CAE Governance and Specification Agent (CA-CAN-01B)"
        summary: "Initial draft constitution establishing MediaAsset as workspace-scoped media metadata entity."
