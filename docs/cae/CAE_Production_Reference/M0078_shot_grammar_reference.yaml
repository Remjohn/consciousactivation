canonical_gae_mapping:
- reference_field: scene_id
  definition: Stable scene key for the reference vocabulary.
  cae_canonical: services/production-program/src/cae_production_program/domain.py:SemanticSceneSpec.scene_index + segment_id
  source_ids:
  - toonflow_app
  - seedance2_openchatcut_adapter
  authority: CAE
- reference_field: shot_id
  definition: Stable ordered shot key within a scene; reference-only grouping, not a new runtime object.
  cae_canonical: docs/cae/CAE_Production_Reference/M0078_shot_grammar_reference.yaml
  source_ids:
  - seedance2_openchatcut_adapter
  - toonflow_app
  authority: CAE_REFERENCE
- reference_field: start_seconds
  definition: Shot start time in seconds.
  cae_canonical: services/production-program/src/cae_production_program/domain.py:SemanticSceneSpec.start_time
  source_ids:
  - seedance2_openchatcut_adapter
  authority: CAE
- reference_field: end_seconds
  definition: Shot end time in seconds; must be greater than start.
  cae_canonical: services/production-program/src/cae_production_program/domain.py:SemanticSceneSpec.end_time
  source_ids:
  - seedance2_openchatcut_adapter
  authority: CAE
- reference_field: duration_seconds
  definition: Shot duration; for segmented prompts, sum of shot windows must equal parent duration.
  cae_canonical: services/production-program/src/cae_production_program/domain.py:SemanticSceneSpec.duration
  source_ids:
  - seedance2_openchatcut_adapter
  - toonflow_app
  authority: CAE
- reference_field: scene
