  - mandate: M08
    depends_on: [M03, M06, M07]
    target: composition_compatibility
    primary_requirement: FR-IP-004
    verification: contract_tests + operator_review
  - mandate: M09
    depends_on: [M07, M08]
    target: evidence_handoff
    primary_requirement: FR-IP-007, FR-IP-010
    verification: lineage_integrity + anti_fabrication tests
  - mandate: M10
    depends_on: [M09, M05]
    target: content_menu_readiness
    primary_requirement: FR-IP-010
    verification: real_candidate_to_menu trace
  - mandate: M11
    depends_on: [M06, M07, M08, M09, M10]
    target: end_to_end_reality_contact_regression
    primary_requirement: all
    verification: staging + adversarial + docs_integrity
