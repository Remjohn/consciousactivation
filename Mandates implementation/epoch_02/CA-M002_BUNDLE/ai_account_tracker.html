<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Account Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Custom subtle styling for checkboxes */
    .custom-checkbox {
      width: 1.25rem;
      height: 1.25rem;
      cursor: pointer;
      accent-color: #4f46e5;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8 font-sans">
  <div class="max-w-6xl mx-auto">
    
    <!-- Header Section -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6 pb-4 border-b border-slate-800">
      <div>
        <h1 class="text-2xl md:text-3xl font-bold text-white tracking-tight">AI Account Usage Tracker</h1>
        <p class="text-slate-400 text-sm mt-1">Check off accounts as you use them. Progress saves automatically in your browser.</p>
      </div>
      
      <!-- Actions -->
      <div class="flex items-center gap-3">
        <button id="reset-btn" class="px-4 py-2 bg-rose-600/20 hover:bg-rose-600/30 text-rose-300 border border-rose-500/30 rounded-lg text-sm font-medium transition-all duration-150 flex items-center gap-2 cursor-pointer">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
          </svg>
          Reset All
        </button>
      </div>
    </div>

    <!-- Table Container -->
    <div class="bg-slate-800/50 border border-slate-700/60 rounded-xl shadow-xl overflow-hidden backdrop-blur-sm">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-800/80 text-slate-300 text-sm border-b border-slate-700/80">
              <th class="py-3.5 px-4 font-semibold w-12 text-center">#</th>
              <th class="py-3.5 px-4 font-semibold min-w-[280px]">Email Address</th>
              <th class="py-3.5 px-4 font-semibold text-center w-28">ChatGPT</th>
              <th class="py-3.5 px-4 font-semibold text-center w-28">Claude</th>
              <th class="py-3.5 px-4 font-semibold text-center w-28">Gemini</th>
              <th class="py-3.5 px-4 font-semibold text-center w-28">Grok</th>
            </tr>
          </thead>
          <tbody id="account-table-body" class="divide-y divide-slate-700/40 text-slate-200 text-sm">
            <!-- Rows rendered via Javascript -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 bg-slate-800 text-slate-200 border border-slate-700 px-4 py-3 rounded-lg shadow-2xl transition-opacity duration-300 opacity-0 pointer-events-none flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
      <span id="toast-message">State saved locally</span>
    </div>

  </div>

  <script>
    const emails = [
      "mitanoagency@gmail.com",
      "soulcolorwheel@gmail.com",
      "emmanuelnyanguila@gmail.com",
      "kimyanyanguila@gmail.com",
      "emilio.consciouselite@gmail.com",
      "founder@conscioustrack.my",
      "socialvideosbranding@gmail.com",
      "emmanuelnyanguila.influencer@gmail.com",
      "mistermitano@gmail.com",
      "mitanodelaluna@gmail.com",
      "emilio.mitanoagency@gmail.com"
    ];

    const models = ["chatgpt", "claude", "gemini", "grok"];
    const STORAGE_KEY = "ai_account_tracker_state";

    // Load state from localStorage or initialize empty object
    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        return saved ? JSON.parse(saved) : {};
      } catch (e) {
        console.error("Could not load from localStorage", e);
        return {};
      }
    }

    // Save state to localStorage
    function saveState(state) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        showToast("Progress saved");
      } catch (e) {
        console.error("Could not save to localStorage", e);
      }
    }

    let state = loadState();

    // Render the table
    function renderTable() {
      const tbody = document.getElementById("account-table-body");
      tbody.innerHTML = "";

      emails.forEach((email, index) => {
        const tr = document.createElement("tr");
        tr.className = "hover:bg-slate-700/30 transition-colors duration-100";

        // Index column
        const tdIdx = document.createElement("td");
        tdIdx.className = "py-3 px-4 text-center text-slate-500 font-mono text-xs";
        tdIdx.textContent = index + 1;
        tr.appendChild(tdIdx);

        // Email column
        const tdEmail = document.createElement("td");
        tdEmail.className = "py-3 px-4 font-mono text-slate-300 selection:bg-indigo-500 selection:text-white";
        tdEmail.textContent = email;
        tr.appendChild(tdEmail);

        // Model Checkboxes
        models.forEach(model => {
          const td = document.createElement("td");
          td.className = "py-3 px-4 text-center";

          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.className = "custom-checkbox rounded border-slate-600 text-indigo-600 focus:ring-indigo-500 focus:ring-offset-slate-800";
          
          const key = `${email}_${model}`;
          checkbox.checked = !!state[key];

          checkbox.addEventListener("change", (e) => {
            state[key] = e.target.checked;
            saveState(state);
          });

          td.appendChild(checkbox);
          tr.appendChild(td);
        });

        tbody.appendChild(tr);
      });
    }

    // Reset button functionality
    document.getElementById("reset-btn").addEventListener("click", () => {
      if (confirm("Are you sure you want to clear all checkboxes?")) {
        state = {};
        localStorage.removeItem(STORAGE_KEY);
        renderTable();
        showToast("All checkboxes cleared");
      }
    });

    // Toast notification utility
    let toastTimeout;
    function showToast(message) {
      const toast = document.getElementById("toast");
      const toastMsg = document.getElementById("toast-message");
      toastMsg.textContent = message;
      
      toast.classList.remove("opacity-0");
      toast.classList.add("opacity-100");

      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove("opacity-100");
        toast.classList.add("opacity-0");
      }, 1500);
    }

    // Initial Render
    renderTable();
  </script>
</body>
</html>
