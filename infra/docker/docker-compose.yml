name: conscious-activations

services:
  api:
    build:
      context: ../..
      dockerfile: infra/docker/dockerfile.api
    ports:
      - "8000:8000"
    environment:
      CA_DATA_ROOT: /state
      CA_MEDIA_ROOT: /media
      CA_DELEGATION_ROOT: /app/packages/ca_delegation_rc4
      CA_STUDIO_RPC_ENTRYPOINT: /app/services/studio/dist/rpc.js
    volumes:
      - ca-state:/state
      - ca-media:/media
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: unless-stopped

  # TS-APP-UI-001: dockerfile.web build context follows the same pattern the
  # `api` service above already uses (repo root, resolved as ../.. from this
  # file's location) rather than the spec's literal "context: ." sketch,
  # because dockerfile.web's COPY instructions (package.json, services/studio,
  # apps/web) are all repo-root-relative, not apps/web-relative.
  web:
    build:
      context: ../..
      dockerfile: infra/docker/dockerfile.web
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  ca-state: {}
  ca-media: {}
