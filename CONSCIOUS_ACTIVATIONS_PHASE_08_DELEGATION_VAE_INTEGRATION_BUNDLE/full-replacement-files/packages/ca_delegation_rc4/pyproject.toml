[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ca-delegation-rc4"
version = "0.1.0.dev1"
description = "Exact, non-forking consumer for delegation-contracts@1.1.0-rc.4."
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ca_delegation_rc4*"]
