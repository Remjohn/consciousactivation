version: 0.1
name: Matrix of Edging Candidate Dimensions
dimensions:
  evidence_density:
    question: How strongly is the pressure supported by first-party and external evidence?
  current_relevance:
    question: How strongly does the pressure intersect the current audience/guest/context state?
  congruence:
    question: How strongly do the Guest and Audience semantic maps intersect on this pressure?
  invariant_activation:
    question: Which existential invariants are active and how strongly?
  collision_intensity:
    question: How much meaningful contradiction, asymmetry, or unresolved tension exists?
  freshness:
    question: Is the pressure newly salient or materially changed in the current environment?
  recognition_potential:
    question: Is the pressure likely to articulate something the audience already lives but has not named?
  novelty:
    question: Does the candidate avoid obvious repetition of prior activations?
  speakability:
    question: Can the Guest plausibly respond from lived experience rather than abstract commentary?
  routeability:
    question: Can the resulting material later enter the approved CCF/CMF pipeline?
  historical_survival:
    question: What does prior activation/outcome memory say about similar pressure geometries?
  saturation_penalty:
    question: Has this pressure been over-activated without new signal?
selection_principles:
  - no_single_scalar_may_hide_component_failure
  - high_charge_is_not_a_reason_for_rejection
  - unsupported_is_a_reason_for_rejection
  - genericity_is_a_selection_failure
  - contradictions_should_be_preserved
