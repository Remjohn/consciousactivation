version: 0.1
families:
  TENSION:
    - TENSION_TYPE_UNRESOLVED
    - TENSION_TOPIC_COLLAPSE
    - TENSION_DUPLICATE
  WEBHOOK:
    - WEBHOOK_STATE_INVALID
    - WEBHOOK_THRESHOLD_UNMET
    - WEBHOOK_COOLDOWN_VIOLATION
  EVIDENCE:
    - EVIDENCE_INSUFFICIENT
    - EVIDENCE_STALE
    - EVIDENCE_CONTRADICTED
    - EVIDENCE_PROVENANCE_MISSING
  PRESSURE_FIELD:
    - PRESSURE_FIELD_EMPTY
    - PRESSURE_FIELD_STALE
    - PRESSURE_FIELD_LINEAGE_LOSS
  CANDIDATE:
    - CANDIDATE_DUPLICATE
    - CANDIDATE_UNSUPPORTED
    - CANDIDATE_SATURATED
    - CANDIDATE_NON_ROUTEABLE
  EDGING:
    - EDGING_WEIGHT_COLLAPSE
    - EDGING_COMPONENT_CONFLICT
    - EDGING_ALTERNATIVE_SUPPRESSION
  ANTI_CENTROID:
    - CENTROID_FLATTENING
    - GENERIC_ABSTRACTION
    - HEDGE_INFLATION
    - FALSE_BALANCE
    - CHARGE_DILUTION
    - UNAUTHORIZED_SOFTENING
  ACTIVATION:
    - BROAD_SIGNAL_DRIFT
    - QUESTION_PRESUPPOSITION
    - QUESTION_TOO_GENERIC
    - QUESTION_OVERDETERMINED
  GOVERNANCE:
    - ROLE_BOUNDARY_VIOLATION
    - HUMAN_TRUTH_BOUNDARY_VIOLATION
    - PROHIBITED_OPERATION
repair:
  default: diagnostic_repair
  unsupported_evidence: downgrade_or_escalate
  centroid_flattening: restore_source_charge_and_recompile
  question_presupposition: rewrite_from_broad_signal
  stale_pressure: refresh_state_before_selection
