version: 0.1
functions:
  - id: detect_tension_candidates
    role: derive candidate tensions from authorized world and relational state
  - id: build_pressure_field
    role: compose current tension candidates with context and evidence lineage
  - id: score_edging_candidate
    role: evaluate candidate across canonical edging dimensions
  - id: preserve_contradiction
    role: retain supported contradictory evidence as first-class signal
  - id: test_candidate_survival
    role: compare candidate against alternatives and rejection conditions
  - id: select_broad_primary_signal
    role: choose a pre-authentication pressure cue
  - id: compile_activation_event
    role: convert broad signal into a human-first prompt
  - id: patrol_centroid_flattening
    role: detect RLHF-style averaging, sanitization, abstraction, and de-charge
  - id: check_activation_presupposition
    role: ensure the prompt does not prewrite the Guest response
  - id: issue_edge_receipt
    role: persist decision lineage and rejected alternatives
