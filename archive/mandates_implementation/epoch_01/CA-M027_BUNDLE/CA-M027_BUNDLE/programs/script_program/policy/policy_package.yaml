schema_id: cae.policy_rule_package
schema_version: "1.0.0"
package_id: script_program_policy
version: "1.0.0"
status: ACTIVE
applicable_program: script_program
scope: script_authoring_and_approval
description: >
  Declarative authorization rules for script_program authority lanes.
  Preserves constitutional invariants: transfer contract creation is
  prohibited for unapproved scripts; approval requires COMMANDER lane
  and OPERATOR_DECISION evidence.

rules:
  - predicate_id: script_propose_composer
    operation: cae.script.propose
    required_authority_lane: COMPOSER
    allow_delegation: false
    evidence_prerequisites:
      - evidence_class: EXECUTABLE
        required: true
    escalation_conditions: []

  - predicate_id: script_compile_package
    operation: cae.script.compile_package
    required_authority_lane: COMPOSER
    allow_delegation: false
    evidence_prerequisites:
      - evidence_class: EXECUTABLE
        required: true
    escalation_conditions: []

  - predicate_id: script_evaluate_qa
    operation: cae.script.evaluate_qa
    required_authority_lane: ANALYST
    allow_delegation: false
    evidence_prerequisites:
      - evidence_class: EXECUTABLE
        required: true
    escalation_conditions: []

  - predicate_id: script_approve_commander
    operation: approve
    required_authority_lane: COMMANDER
    allow_delegation: false
    evidence_prerequisites:
      - evidence_class: OPERATOR_DECISION
        required: true
      - evidence_class: EXECUTABLE
        required: true
    escalation_conditions: []
    notes: Stage-12 human authorization; cannot be lowered by package revision.

  - predicate_id: script_create_transfer_contract
    operation: create_transfer_contract
    required_authority_lane: COMMANDER
    allow_delegation: false
    evidence_prerequisites:
      - evidence_class: OPERATOR_DECISION
        required: true
    escalation_conditions: []
    notes: Strictly prohibited for unapproved scripts (enforced by runtime + this rule).

constitutional_dependencies:
  - dependency_id: cae_stage12_human_auth
    ref: FR-AUTH-002
    immutable: true
  - dependency_id: script_program_cae
    ref: programs/script_program/CAE.md
    immutable: true
