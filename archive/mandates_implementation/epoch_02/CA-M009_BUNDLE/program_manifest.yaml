program:
  id: "preparation_graph_program"
  version: "1.0.0"
  status: ACTIVE
  mandate: "CA-M009"
  causal_stage: "Stage 05 — Declarative PreProduction"
  governing_fr: "FR-009 / preparation-graph contract"
  purpose: >
    Implements the preparation graph as a first-class, operator-controlled,
    revisioned planning artifact.  Before execution an Operator may change
    parameters and create a new graph revision.  Once a run begins, the
    active execution is bound to the exact graph revision captured for that
    run.  The runtime, not browser-local state, is authoritative.
  operator_entrypoint: "run_preparation_graph"
  inputs:
    - "campaign_id"
    - "preparation_parameters"
  preconditions:
    - "workspace_active"
    - "campaign_exists"
  outputs:
    - "preparation_graph"
    - "graph_revision"
    - "graph_run_binding"
  artifacts:
    - "preparation_graph_revision"
    - "graph_run_binding_receipt"
  harness: "PREPARATION_GRAPH_HARNESS_V1"
  state_machine: "PREPARATION_GRAPH_STATE_MACHINE_V1"
  lifecycle_states:
    - DRAFT_GRAPH
    - CANDIDATE_GRAPH_REVISION
    - EXECUTION_BOUND
    - ACTIVE_EXECUTION_GRAPH
    - HISTORICAL
  lanes:
    - "ANALYST"
    - "COMMANDER"
  operations:
    - name: "create_graph"
      lane: "COMMANDER"
      description: "Create a new preparation graph in DRAFT state."
    - name: "save_graph_revision"
      lane: "ANALYST"
      description: "Operator saves a new immutable revision. Rejects stale base (INV-M009-02)."
    - name: "bind_run_to_revision"
      lane: "COMMANDER"
      description: "Bind a run to an exact revision at execution start (INV-M009-03)."
    - name: "get_graph_operator_view"
      lane: "ANY"
      description: "Read-only projection for operator surface (UI §9)."
    - name: "verify_active_run_integrity"
      lane: "ANY"
      description: "Digest check: verify run binding has not been mutated (INV-M009-05)."
  invariants:
    - id: "INV-M009-01"
      description: "graph_revision rows are immutable once written."
    - id: "INV-M009-02"
      description: "Stale write rejected: base_revision_id must match graph.latest_revision_id."
    - id: "INV-M009-03"
      description: "Active run bindings are immutable; revision cannot be changed after run starts."
    - id: "INV-M009-04"
      description: "Historical revisions remain inspectable (no delete)."
    - id: "INV-M009-05"
      description: "Run binding stores canonical_sha256 digest of parameters at bind time."
  false_proof_case: >
    The UI changes from R1 to R2 while the backend mutates the same stored row.
    The active run now unknowingly uses R2.  This MUST fail:
    verify_active_run_integrity will detect the digest mismatch, and the DB
    trigger fn_graph_revision_immutability will raise at the DB layer.
  connections:
    - "supabase_postgres"
    - "sqlite_local"
  hooks:
    - "stale_base_revision_check"
    - "active_binding_immutability_check"
    - "digest_integrity_check"
  receipts:
    - "graph_revision_receipt"
    - "graph_run_binding_receipt"
  dependencies:
    - program_id: "collision_discovery_program"
      version_requirement: ">=1.0.0"
      reason: "Preparation graph includes collision hypothesis references."
    - program_id: "audience_context_program"
      version_requirement: ">=1.0.0"
      reason: "Audience context is a preparation parameter."
  not_in_scope:
    - "CA-M011 snapshot sealing (except minimum binding contract needed for future seal)"
    - "UI redesign"
    - "Campaign lifecycle semantics beyond graph binding"
  operator_gates:
    - "ca_m009_graph_revision_approval"
  migration: "drafts/0011_cae_preparation_graph.sql"
